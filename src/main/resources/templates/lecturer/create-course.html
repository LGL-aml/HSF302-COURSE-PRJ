<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Tạo khóa học - Course Shop</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-plus-circle"></i> Tạo khóa học mới</h2>
                <a th:href="@{/courses/lecture/manage}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </a>
            </div>

            <!-- Error Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <form th:action="@{/courses/lecture/create}" method="post" enctype="multipart/form-data" id="createCourseForm">

                        <!-- Basic Information -->
                        <h5 class="border-bottom pb-2 mb-3"><i class="fas fa-info-circle"></i> Thông tin cơ bản</h5>

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="title" class="form-label">Tiêu đề khóa học <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" name="title"
                                       th:value="${course?.title}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="topicId" class="form-label">Chủ đề <span class="text-danger">*</span></label>
                                <select class="form-select" id="topicId" name="topicId" required>
                                    <option value="">-- Chọn chủ đề --</option>
                                    <option th:each="topic : ${topics}"
                                            th:value="${topic.id}"
                                            th:text="${topic.name}"
                                            th:selected="${course?.topicId == topic.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Giá khóa học (VND) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="price" name="price"
                                   min="0" step="1000" th:value="${course?.price}" required>
                            <small class="text-muted">Nhập giá bằng số, ví dụ: 199000. Nhập 0 cho khóa học miễn phí.</small>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả ngắn <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description"
                                      rows="2" required th:text="${course?.description}"></textarea>
                            <small class="text-muted">Mô tả ngắn gọn về khóa học (hiển thị trong danh sách)</small>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Nội dung chi tiết <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="content" name="content"
                                      rows="5" required th:text="${course?.content}"></textarea>
                            <small class="text-muted">Mô tả chi tiết về khóa học, những gì học viên sẽ học được</small>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="duration" class="form-label">Thời lượng (giờ) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="duration" name="duration"
                                       min="0" step="0.5" th:value="${course?.duration}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="coverImage" class="form-label">Ảnh bìa <span class="text-danger">*</span></label>
                                <input type="file" class="form-control" id="coverImage" name="coverImage"
                                       accept="image/*" required>
                                <small class="text-muted">Định dạng: JPG, PNG. Kích thước khuyến nghị: 1280x720px</small>
                            </div>
                        </div>

                        <!-- Modules and Videos -->
                        <h5 class="border-bottom pb-2 mb-3 mt-4">
                            <i class="fas fa-list"></i> Module và Video
                        </h5>

                        <div id="modulesContainer">
                            <!-- Modules will be added here dynamically -->
                        </div>

                        <button type="button" class="btn btn-outline-primary mb-4" onclick="addModule()">
                            <i class="fas fa-plus"></i> Thêm Module
                        </button>

                        <!-- Hidden field for modules JSON -->
                        <input type="hidden" id="modules" name="modules">

                        <!-- Submit Buttons -->
                        <div class="border-top pt-3 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Tạo khóa học
                            </button>
                            <a th:href="@{/courses/lecture/manage}" class="btn btn-secondary btn-lg ms-2">
                                <i class="fas fa-times"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script layout:fragment="scripts">
        let moduleIndex = 0;

        function addModule() {
            const container = document.getElementById('modulesContainer');
            const moduleDiv = document.createElement('div');
            moduleDiv.className = 'card mb-3 module-card';
            moduleDiv.setAttribute('data-module-index', moduleIndex);

            moduleDiv.innerHTML = `
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <strong>Module ${moduleIndex + 1}</strong>
                    <button type="button" class="btn btn-sm btn-danger" onclick="removeModule(this)">
                        <i class="fas fa-trash"></i> Xóa Module
                    </button>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Tiêu đề Module <span class="text-danger">*</span></label>
                        <input type="text" class="form-control module-title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Thứ tự</label>
                        <input type="number" class="form-control module-order" value="${moduleIndex}" min="0">
                    </div>
                    <div class="videos-container mb-2">
                        <!-- Videos will be added here -->
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addVideo(this)">
                        <i class="fas fa-plus"></i> Thêm Video
                    </button>
                </div>
            `;

            container.appendChild(moduleDiv);
            moduleIndex++;
        }

        function removeModule(button) {
            button.closest('.module-card').remove();
        }

        function addVideo(button) {
            const videosContainer = button.parentElement.querySelector('.videos-container');
            const videoDiv = document.createElement('div');
            videoDiv.className = 'row mb-2 video-row';

            videoDiv.innerHTML = `
                <div class="col-md-5">
                    <input type="text" class="form-control video-title" placeholder="Tiêu đề video" required>
                </div>
                <div class="col-md-6">
                    <input type="url" class="form-control video-url" placeholder="URL video (YouTube, Vimeo...)" required>
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-sm btn-danger w-100" onclick="removeVideo(this)">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            videosContainer.appendChild(videoDiv);
        }

        function removeVideo(button) {
            button.closest('.video-row').remove();
        }

        // Collect modules data before submit
        document.getElementById('createCourseForm').addEventListener('submit', function(e) {
            const modules = [];
            document.querySelectorAll('.module-card').forEach((moduleCard, idx) => {
                const module = {
                    title: moduleCard.querySelector('.module-title').value,
                    orderIndex: parseInt(moduleCard.querySelector('.module-order').value) || idx,
                    videos: []
                };

                moduleCard.querySelectorAll('.video-row').forEach(videoRow => {
                    module.videos.push({
                        title: videoRow.querySelector('.video-title').value,
                        videoUrl: videoRow.querySelector('.video-url').value
                    });
                });

                modules.push(module);
            });

            document.getElementById('modules').value = JSON.stringify(modules);
        });

        // Add one module by default
        window.addEventListener('DOMContentLoaded', function() {
            addModule();
        });
    </script>
</body>
</html>
