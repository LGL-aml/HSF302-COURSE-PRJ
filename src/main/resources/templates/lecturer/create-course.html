<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Tạo khóa học - Course Shop</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="card">
            <div class="card-body">
                <h3>Tạo khóa học mới</h3>
                <p>Tính năng tạo khóa học qua giao diện web đang được phát triển.</p>
                <p>Hiện tại, vui lòng sử dụng API endpoint: <code>POST /api/courses</code></p>
                <a th:href="@{/lecturer/courses}" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Quay lại
                </a>
            </div>
        </div>
    </div>
</body>
</html>
