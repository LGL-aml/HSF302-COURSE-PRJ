<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{lecturer/layout}">
<head>
    <title>Tạo khóa học - Course Shop</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="lecturer-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Tạo khóa học mới</h4>
                <a th:href="@{/lecturer/courses}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                </a>
            </div>

            <form th:action="@{/courses/lecture/create}" method="post" enctype="multipart/form-data" id="createCourseForm">
                <!-- Basic Information -->
                <h5 class="border-bottom pb-2 mb-3"><i class="fas fa-info-circle me-2"></i>Thông tin cơ bản</h5>

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="title" class="form-label">Tiêu đề khóa học <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="col-md-4">
                        <label for="topicId" class="form-label">Chủ đề <span class="text-danger">*</span></label>
                        <select class="form-select" id="topicId" name="topicId" required>
                            <option value="">-- Chọn chủ đề --</option>
                            <option th:each="topic : ${topics}" th:value="${topic.id}" th:text="${topic.name}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="price" class="form-label">Giá khóa học (VND)</label>
                        <input type="number" class="form-control" id="price" name="price" min="0" step="1000" value="0">
                        <small class="text-muted">Nhập 0 cho khóa học miễn phí</small>
                    </div>
                    <div class="col-md-6">
                        <label for="duration" class="form-label">Thời lượng (giờ) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="duration" name="duration" min="0" step="1" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Mô tả ngắn <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">Nội dung chi tiết</label>
                    <textarea class="form-control" id="content" name="content" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label for="coverImage" class="form-label">Ảnh bìa <span class="text-danger">*</span></label>
                    <input type="file" class="form-control" id="coverImage" name="coverImage" accept="image/*" required>
                    <small class="text-muted">Định dạng: JPG, PNG. Kích thước: 1280x720px</small>
                </div>

                <!-- Modules and Videos -->
                <h5 class="border-bottom pb-2 mb-3 mt-4"><i class="fas fa-list me-2"></i>Module và Video</h5>

                <div id="modulesContainer"></div>

                <button type="button" class="btn btn-outline-primary mb-4" onclick="addModule()">
                    <i class="fas fa-plus me-1"></i>Thêm Module
                </button>

                <input type="hidden" id="modules" name="modules">

                <!-- Submit -->
                <div class="border-top pt-3 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Tạo khóa học
                    </button>
                    <a th:href="@{/lecturer/courses}" class="btn btn-secondary ms-2">
                        <i class="fas fa-times me-1"></i>Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            let moduleIndex = 0;

            function addModule() {
                const container = document.getElementById('modulesContainer');
                const moduleDiv = document.createElement('div');
                moduleDiv.className = 'card mb-3 module-card';
                moduleDiv.setAttribute('data-module-index', moduleIndex);

                moduleDiv.innerHTML = `
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <strong>Module ${moduleIndex + 1}</strong>
                        <button type="button" class="btn btn-sm btn-danger" onclick="removeModule(this)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Tiêu đề Module <span class="text-danger">*</span></label>
                            <input type="text" class="form-control module-title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Thứ tự</label>
                            <input type="number" class="form-control module-order" value="${moduleIndex}" min="0">
                        </div>

                        <!-- Videos -->
                        <h6 class="mt-3 mb-2"><i class="fas fa-video me-1"></i> Video bài giảng</h6>
                        <div class="videos-container mb-2"></div>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addVideo(this)">
                            <i class="fas fa-plus me-1"></i>Thêm Video
                        </button>

                        <!-- Quiz Section -->
                        <hr class="my-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0"><i class="fas fa-question-circle me-1 text-warning"></i> Quiz kiểm tra</h6>
                            <button type="button" class="btn btn-sm btn-outline-warning toggle-quiz-btn" onclick="toggleQuiz(this)">
                                <i class="fas fa-plus me-1"></i>Thêm Quiz
                            </button>
                        </div>
                        <div class="quiz-section" style="display:none;">
                            <div class="card border-warning mb-2">
                                <div class="card-body">
                                    <div class="row mb-2">
                                        <div class="col-md-8">
                                            <label class="form-label">Tiêu đề Quiz</label>
                                            <input type="text" class="form-control quiz-title" placeholder="VD: Kiểm tra Module 1">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Điểm đạt (%)</label>
                                            <input type="number" class="form-control quiz-pass-score" value="70" min="0" max="100">
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Mô tả Quiz</label>
                                        <input type="text" class="form-control quiz-description" placeholder="Mô tả ngắn về bài quiz">
                                    </div>
                                    <h6 class="mt-3 mb-2">Câu hỏi</h6>
                                    <div class="questions-container"></div>
                                    <button type="button" class="btn btn-sm btn-outline-info mt-2" onclick="addQuestion(this)">
                                        <i class="fas fa-plus me-1"></i>Thêm câu hỏi
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(moduleDiv);
                moduleIndex++;
            }

            function removeModule(button) {
                button.closest('.module-card').remove();
            }

            function toggleQuiz(button) {
                const moduleCard = button.closest('.module-card');
                const quizSection = moduleCard.querySelector('.quiz-section');
                if (quizSection.style.display === 'none') {
                    quizSection.style.display = 'block';
                    button.innerHTML = '<i class="fas fa-minus me-1"></i>Ẩn Quiz';
                    button.classList.remove('btn-outline-warning');
                    button.classList.add('btn-warning');
                } else {
                    quizSection.style.display = 'none';
                    button.innerHTML = '<i class="fas fa-plus me-1"></i>Thêm Quiz';
                    button.classList.remove('btn-warning');
                    button.classList.add('btn-outline-warning');
                }
            }

            function addQuestion(button) {
                const questionsContainer = button.parentElement.querySelector('.questions-container');
                const qIndex = questionsContainer.querySelectorAll('.question-card').length;
                const questionDiv = document.createElement('div');
                questionDiv.className = 'card mb-2 question-card border-info';

                questionDiv.innerHTML = `
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <strong class="text-info">Câu hỏi ${qIndex + 1}</strong>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeQuestion(this)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="mb-2">
                            <input type="text" class="form-control question-text" placeholder="Nhập câu hỏi...">
                        </div>
                        <div class="options-container"></div>
                        <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="addOption(this)">
                            <i class="fas fa-plus me-1"></i>Thêm đáp án
                        </button>
                    </div>
                `;

                questionsContainer.appendChild(questionDiv);
                // Tự động thêm 4 đáp án mặc định
                const addOptBtn = questionDiv.querySelector('.btn-outline-secondary');
                for (let i = 0; i < 4; i++) {
                    addOption(addOptBtn);
                }
            }

            function removeQuestion(button) {
                button.closest('.question-card').remove();
            }

            function addOption(button) {
                const optionsContainer = button.parentElement.querySelector('.options-container');
                const optionDiv = document.createElement('div');
                optionDiv.className = 'row mb-1 option-row align-items-center';

                optionDiv.innerHTML = `
                    <div class="col-md-1 text-center">
                        <input type="radio" class="form-check-input option-correct" name="correct_${Date.now()}_${Math.random()}" title="Đáp án đúng">
                    </div>
                    <div class="col-md-7">
                        <input type="text" class="form-control form-control-sm option-text" placeholder="Nội dung đáp án">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm option-explanation" placeholder="Giải thích (tùy chọn)">
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;

                optionsContainer.appendChild(optionDiv);

                // Đặt cùng name group cho radio buttons trong cùng question
                const questionCard = button.closest('.question-card');
                const radioName = 'correct_q_' + Array.from(document.querySelectorAll('.question-card')).indexOf(questionCard);
                questionCard.querySelectorAll('.option-correct').forEach(radio => {
                    radio.name = radioName;
                });
            }

            function removeOption(button) {
                button.closest('.option-row').remove();
            }

            function addVideo(button) {
                const videosContainer = button.parentElement.querySelector('.videos-container');
                const videoDiv = document.createElement('div');
                videoDiv.className = 'row mb-2 video-row';

                videoDiv.innerHTML = `
                    <div class="col-md-5">
                        <input type="text" class="form-control video-title" placeholder="Tiêu đề video" required>
                    </div>
                    <div class="col-md-6">
                        <input type="url" class="form-control video-url" placeholder="URL video" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-sm btn-danger w-100" onclick="removeVideo(this)">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;

                videosContainer.appendChild(videoDiv);
            }

            function removeVideo(button) {
                button.closest('.video-row').remove();
            }

            document.getElementById('createCourseForm').addEventListener('submit', function(e) {
                const modules = [];
                document.querySelectorAll('.module-card').forEach((moduleCard, idx) => {
                    const module = {
                        title: moduleCard.querySelector('.module-title').value,
                        orderIndex: parseInt(moduleCard.querySelector('.module-order').value) || idx,
                        videos: [],
                        quiz: null
                    };

                    // Collect videos
                    moduleCard.querySelectorAll('.video-row').forEach(videoRow => {
                        module.videos.push({
                            title: videoRow.querySelector('.video-title').value,
                            videoUrl: videoRow.querySelector('.video-url').value
                        });
                    });

                    // Collect quiz if visible
                    const quizSection = moduleCard.querySelector('.quiz-section');
                    if (quizSection && quizSection.style.display !== 'none') {
                        const questions = [];
                        moduleCard.querySelectorAll('.question-card').forEach((qCard, qIdx) => {
                            const options = [];
                            qCard.querySelectorAll('.option-row').forEach(optRow => {
                                options.push({
                                    optionText: optRow.querySelector('.option-text').value,
                                    correct: optRow.querySelector('.option-correct').checked,
                                    explanation: optRow.querySelector('.option-explanation').value || null
                                });
                            });
                            questions.push({
                                questionText: qCard.querySelector('.question-text').value,
                                orderIndex: qIdx,
                                options: options
                            });
                        });

                        if (questions.length > 0) {
                            module.quiz = {
                                title: moduleCard.querySelector('.quiz-title').value || ('Quiz - Module ' + (idx + 1)),
                                description: moduleCard.querySelector('.quiz-description').value || null,
                                passScore: parseInt(moduleCard.querySelector('.quiz-pass-score').value) || 70,
                                questions: questions
                            };
                        }
                    }

                    modules.push(module);
                });

                document.getElementById('modules').value = JSON.stringify(modules);
            });
        </script>
    </div>
</body>
</html>
