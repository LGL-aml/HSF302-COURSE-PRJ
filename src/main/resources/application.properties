spring.application.name=Course-Shop

server.port=3979

debug=false

logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.web.multipart=DEBUG
logging.level.com.jungle.courseshop.controller=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# ===============================
# = DATASOURCE (MySQL Railway)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/${MYSQL_DB}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================`

# = JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================
# = Cloudinary Configuration
# ===============================
cloudinary.cloud.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# ===============================
# = Admin Configuration
# ===============================
admin.username=admin
admin.password=Admin@123
admin.email=admin20@gmail.com

# ===============================
# = Mail Configuration
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# = VNPay Configuration
# ===============================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_SECRET_KEY}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}


# ===============================
# = Spring AI Configuration (RAG)
# ===============================
# OpenAI Client (Cerebras API for Chat)
spring.ai.openai.api-key=${SPRING_API_KEY}
spring.ai.openai.base-url=${SPRING_API_BASE_URL}
spring.ai.openai.chat.options.model=llama3.1-8b
spring.ai.openai.chat.options.temperature=0.7

# Transformers Embedding Model (Local ONNX - all-MiniLM-L6-v2)
spring.ai.transformers.embedding.onnx.modelUri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
spring.ai.transformers.embedding.tokenizer.uri=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json

# Vector Store (Simple In-Memory for MySQL)
spring.ai.vectorstore.simple.dimensions=384


VNPT_EKYC_API_URL=${VNPT_EKYC_API_URL}
VNPT_EKYC_TOKEN_ID=${VNPT_EKYC_TOKEN_ID}
VNPT_EKYC_TOKEN_KEY=${VNPT_EKYC_TOKEN_KEY}
VNPT_EKYC_ACCESS_TOKEN=${VNPT_EKYC_ACCESS_TOKEN}