<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Hồ sơ - Course Shop</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img th:src="${user.avatar != null ? user.avatar : 'https://freesvg.org/img/abstract-user-flat-3.png'}"
                         class="rounded-circle mb-3"
                         style="width: 120px; height: 120px; object-fit: cover;"
                         alt="Avatar">
                    <h4 class="mb-1" th:text="${user.fullName}">Full name</h4>
                    <div class="text-muted" th:text="${user.username}">username</div>
                    <div class="mt-2">
                        <span class="badge bg-secondary" th:text="${user.role}">ROLE</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Thông tin cá nhân</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile}" method="post" enctype="multipart/form-data" th:object="${updateUserRequest}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ và tên</label>
                                <input class="form-control" type="text" th:field="*{fullname}" th:placeholder="${user.fullName}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input class="form-control" type="email" th:field="*{email}" th:placeholder="${user.email}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại</label>
                                <input class="form-control" type="text" th:field="*{phone}" th:placeholder="${user.phone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Năm sinh</label>
                                <input class="form-control" type="number" th:field="*{yob}" th:placeholder="${user.yob}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giới tính</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="">-- Chọn --</option>
                                    <option value="MALE">Nam</option>
                                    <option value="FEMALE">Nữ</option>
                                    <option value="OTHER">Khác</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Ảnh đại diện</label>
                                <input class="form-control" type="file" th:field="*{avatar}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Địa chỉ</label>
                                <input class="form-control" type="text" th:field="*{address}" th:placeholder="${user.address}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
