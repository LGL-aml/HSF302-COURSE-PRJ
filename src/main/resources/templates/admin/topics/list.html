<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title th:text="${title}">Quản lý chủ đề</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header slide-in">
            <h2 class="page-title">
                <i class="fas fa-tags"></i> Quản lý chủ đề
            </h2>
            <button class="btn btn-admin btn-admin-primary" data-bs-toggle="modal" data-bs-target="#addTopicModal">
                <i class="fas fa-plus me-2"></i>Thêm chủ đề
            </button>
        </div>

        <div class="admin-card p-4 slide-in">
            <div class="table-responsive">
                <table class="table admin-table align-middle">
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Tên chủ đề</th>
                            <th>Mô tả</th>
                            <th>Ngày tạo</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="topic : ${topics}">
                            <td class="text-muted fw-bold" th:text="'#' + ${topic.id}">1</td>
                            <td class="fw-bold" th:text="${topic.topicName}">Java</td>
                            <td class="text-muted" th:text="${topic.topicDescription}">Mô tả ngắn...</td>
                            <td class="text-muted small" th:text="${#temporals.format(topic.createdAt, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-sm btn-outline-primary edit-topic-btn"
                                            th:data-id="${topic.id}"
                                            th:data-name="${topic.topicName}"
                                            th:data-description="${topic.topicDescription}"
                                            title="Sửa">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <form th:action="@{/admin/topics/{id}/delete(id=${topic.id})}" method="post"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa chủ đề này?');" style="display: inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(topics)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="fas fa-tags fa-3x mb-3 d-block opacity-50"></i>
                                <p class="mb-0">Chưa có chủ đề nào.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Topic Modal -->
        <div class="modal fade" id="addTopicModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/admin/topics}" method="post" th:object="${newTopic}">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="fas fa-plus-circle me-2"></i>Thêm chủ đề mới
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên chủ đề <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả</label>
                                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fas fa-times me-2"></i>Đóng
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Lưu
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script layout:fragment="scripts">
        document.addEventListener('DOMContentLoaded', function() {
            const editButtons = document.querySelectorAll('.edit-topic-btn');
            editButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const name = this.getAttribute('data-name');
                    const desc = this.getAttribute('data-description');
                    alert('Tính năng sửa đang được cập nhật cho topic: ' + name);
                });
            });
        });
    </script>
</body>
</html>
