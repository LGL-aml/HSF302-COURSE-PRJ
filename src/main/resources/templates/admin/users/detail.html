<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title th:text="${title}">Chi tiết người dùng</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Page Header -->
                <div class="page-header slide-in">
                    <h2 class="page-title">
                        <i class="fas fa-user-edit"></i> Chỉnh sửa người dùng
                    </h2>
                    <a th:href="@{/admin/users}" class="btn btn-admin btn-admin-secondary">
                        <i class="fas fa-arrow-left me-2"></i> Quay lại
                    </a>
                </div>

                <div class="admin-card p-4 slide-in">
                    <form th:action="@{/admin/users/{id}/update(id=${user.id})}" method="post">
                        <div class="text-center mb-4">
                            <img th:src="${user.avatar}" class="rounded-circle shadow" width="120" height="120" alt="Avatar"
                                 style="object-fit: cover; border: 4px solid rgba(108, 92, 231, 0.2);">
                            <h4 class="mt-3 fw-bold" th:text="${user.fullName}">Tên người dùng</h4>
                            <p class="text-muted mb-0" th:text="${'@' + user.username}">username</p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ và tên</label>
                                <input type="text" class="form-control" name="fullname" th:value="${user.fullName}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" name="email" th:value="${user.email}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" class="form-control" name="phone" th:value="${user.phone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Địa chỉ</label>
                                <input type="text" class="form-control" name="address" th:value="${user.address}">
                            </div>

                            <div class="col-12 mt-4">
                                <label class="form-label fw-bold">Phân quyền</label>
                                <div class="d-flex gap-3 p-3 border rounded bg-light">
                                    <div class="form-check" th:each="role : ${roles}">
                                        <input class="form-check-input" type="radio" name="role"
                                               th:id="${'role-' + role}" th:value="${role}"
                                               th:checked="${role.name() == user.role}">
                                        <label class="form-check-label text-dark" th:for="${'role-' + role}" th:text="${role}"></label>
                                    </div>
                                </div>
                                <div class="form-text text-warning mt-2">
                                    <i class="fas fa-exclamation-triangle"></i> Lưu ý: Thay đổi quyền có thể ảnh hưởng đến quyền truy cập của người dùng.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/admin/users}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Hủy bỏ
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Lưu thay đổi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
