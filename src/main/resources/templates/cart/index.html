<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Giỏ hàng - Course Shop</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">Giỏ hàng của bạn</h2>

        <!-- Success/Error Messages -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}">
            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="list-group">
                                <div class="list-group-item" th:each="item : ${cart.items}">
                                    <div class="row align-items-center">
                                        <div class="col-md-3">
                                            <img th:src="${item.courseThumbnail}" class="img-fluid rounded" alt="Course">
                                        </div>
                                        <div class="col-md-6">
                                            <h5 th:text="${item.courseTitle}">Course Title</h5>
                                            <p class="text-muted mb-0" th:text="${item.lecturerName}">Lecturer</p>
                                        </div>
                                        <div class="col-md-2 text-end">
                                            <h5 class="text-primary" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">500,000 VNĐ</h5>
                                        </div>
                                        <div class="col-md-1">
                                            <form th:action="@{/cart/remove/{id}(id=${item.courseId})}" method="post">
                                                <button type="submit" class="btn btn-sm btn-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title mb-4">Tổng đơn hàng</h4>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Số khóa học:</span>
                                <strong th:text="${cart.items.size()}">0</strong>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <h5>Tổng cộng:</h5>
                                <h5 class="text-primary" th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">0 VNĐ</h5>
                            </div>
                            <a th:href="@{/payments/checkout}" class="btn btn-primary w-100">
                                <i class="fas fa-credit-card"></i> Thanh toán
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${cart == null or cart.items == null or cart.items.isEmpty()}" class="text-center py-5">
            <i class="fas fa-shopping-cart fa-5x text-muted mb-3"></i>
            <h3>Giỏ hàng trống</h3>
            <p class="text-muted">Hãy thêm khóa học vào giỏ hàng để tiếp tục!</p>
            <a th:href="@{/courses}" class="btn btn-primary">Khám phá khóa học</a>
        </div>
    </div>
</body>
</html>
