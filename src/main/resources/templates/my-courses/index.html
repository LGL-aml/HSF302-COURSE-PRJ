<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Khóa học của tôi - Course Shop</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">Khóa học của tôi</h2>

        <div th:if="${enrollments != null and !enrollments.isEmpty()}" class="row">
            <div class="col-md-4 mb-4" th:each="enrollment : ${enrollments}">
                <div class="card h-100 shadow-sm">
                    <div class="position-relative">
                        <img th:src="${enrollment.coverImage}" class="card-img-top" alt="Course"
                             style="height: 200px; object-fit: cover;">
                        <div class="position-absolute top-0 end-0 m-2">
                            <span class="badge"
                                  th:classappend="${enrollment.status == 'COMPLETED'} ? 'bg-success' : 'bg-warning'"
                                  th:text="${enrollment.status == 'COMPLETED'} ? 'Hoàn thành' : 'Đang học'">
                                Status
                            </span>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${enrollment.courseTitle}">Course Title</h5>
                        <p class="text-muted mb-2">
                            <i class="fas fa-user"></i> <span th:text="${enrollment.creatorName}">Lecturer</span>
                        </p>

                        <div class="mb-3" th:if="${enrollment.progress != null}">
                            <div class="d-flex justify-content-between mb-1">
                                <small>Tiến độ</small>
                                <small th:text="${enrollment.progress + '%'}">0%</small>
                            </div>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${enrollment.progress} + '%'"
                                     th:aria-valuenow="${enrollment.progress}">
                                </div>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <a th:href="@{/courses/learn/{id}(id=${enrollment.courseId})}" class="btn btn-primary w-100 mb-2">
                                <i class="fas fa-play"></i> Tiếp tục học
                            </a>
                            <div class="text-muted small">
                                Đăng ký: <span th:text="${#temporals.format(enrollment.enrollmentDate, 'dd/MM/yyyy')}">01/01/2024</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${enrollments == null or enrollments.isEmpty()}" class="text-center py-5">
            <i class="fas fa-book-open fa-5x text-muted mb-3"></i>
            <h3>Chưa có khóa học nào</h3>
            <p class="text-muted">Bạn chưa đăng ký khóa học nào. Hãy khám phá và đăng ký ngay!</p>
            <a th:href="@{/courses}" class="btn btn-primary">Khám phá khóa học</a>
        </div>
    </div>
</body>
</html>
