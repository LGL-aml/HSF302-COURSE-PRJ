<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<head>
    <title>Quản lý đơn hàng</title>
</head>

<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-shopping-cart me-2"></i>Quản lý đơn hàng</h2>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-light">
                <i class="fas fa-download me-2"></i>Xuất Excel
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-filter me-2"></i>Bộ lọc
            </button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="admin-card">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h6 class="text-muted mb-2">Tổng đơn hàng</h6>
                        <h3 class="mb-0" th:text="${totalOrders}">0</h3>
                    </div>
                    <div class="text-primary">
                        <i class="fas fa-shopping-bag fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="admin-card">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h6 class="text-muted mb-2">Đơn hàng mới</h6>
                        <h3 class="mb-0" th:text="${pendingOrders}">0</h3>
                    </div>
                    <div class="text-success">
                        <i class="fas fa-clock fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="admin-card">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h6 class="text-muted mb-2">Đang xử lý</h6>
                        <h3 class="mb-0" th:text="${processingOrders}">0</h3>
                    </div>
                    <div class="text-warning">
                        <i class="fas fa-spinner fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="admin-card">
                <div class="d-flex align-items-center">
                    <div class="flex-grow-1">
                        <h6 class="text-muted mb-2">Hoàn thành</h6>
                        <h3 class="mb-0" th:text="${completedOrders}">0</h3>
                    </div>
                    <div class="text-info">
                        <i class="fas fa-check-circle fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Orders Table -->
    <div class="admin-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Mã đơn hàng</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="'#' + ${order.id}">#ORD001</td>
                        <td th:text="${order.user.fullname}">Khách hàng</td>
                        <td>
                            <span th:if="${!order.items.isEmpty()}" 
                                  th:text="${order.items[0].course.title}">
                                Khóa học
                            </span>
                            <span th:if="${order.items.size() > 1}" 
                                  class="text-muted small">
                                (+<span th:text="${order.items.size() - 1}"></span> khóa học khác)
                            </span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${order.status.name() == 'COMPLETED' ? 'bg-success' : 
                                                   (order.status.name() == 'PENDING' ? 'bg-warning' : 
                                                   (order.status.name() == 'PROCESSING' ? 'bg-info' : 'bg-secondary'))}"
                                  th:text="${order.status.name() == 'COMPLETED' ? 'Hoàn thành' : 
                                           (order.status.name() == 'PENDING' ? 'Chờ xử lý' : 
                                           (order.status.name() == 'PROCESSING' ? 'Đang xử lý' : order.status.name()))}">
                                Trạng thái
                            </span>
                        </td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')}">01/01/2024</td>
                        <td>
                            <button class="btn btn-sm btn-outline-light me-1" title="Xem chi tiết">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-warning" title="Chỉnh sửa">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x mb-3 d-block opacity-50"></i>
                            <p class="mb-0">Chưa có đơn hàng nào</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <nav class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1">Previous</a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
