<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title th:text="${title}">Quản lý người dùng</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header slide-in">
            <h2 class="page-title">
                <i class="fas fa-users-cog"></i> Quản lý người dùng
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/users/create}" class="btn btn-admin btn-admin-primary">
                    <i class="fas fa-plus me-2"></i> Thêm mới
                </a>
            </div>
        </div>

        <div class="admin-card p-4 slide-in">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0">Danh sách người dùng</h5>
                <div class="input-group" style="max-width: 300px;">
                     <input type="text" class="form-control" placeholder="Tìm kiếm...">
                     <button class="btn btn-outline-secondary"><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table admin-table text-nowrap align-middle">
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Thông tin cá nhân</th>
                            <th>Liên hệ</th>
                            <th>Vai trò</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="text-muted fw-bold" th:text="'#' + ${user.id}">1</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="${user.avatar} ?: '/images/default-avatar.png'" 
                                         class="rounded-circle me-3" width="50" height="50" alt="Avatar"
                                         style="object-fit: cover;">
                                    <div>
                                        <div class="fw-bold" th:text="${user.fullName}">Full Name</div>
                                        <div class="text-muted small" th:text="${'@' + user.username}">username</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="mb-1"><i class="fas fa-envelope me-2 text-muted"></i><span th:text="${user.email}"></span></div>
                                <div class="small text-muted"><i class="fas fa-phone me-2"></i><span th:text="${user.phone}"></span></div>
                            </td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2" 
                                      th:classappend="${user.role == 'ADMIN' ? 'bg-danger' : (user.role == 'LECTURER' ? 'bg-warning text-dark' : 'bg-info')}"
                                      th:text="${user.role}">MEMBER</span>
                            </td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary" title="Chỉnh sửa">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" 
                                          onsubmit="return confirm('Bạn có chắc chắn muốn khóa tài khoản này?');" style="display: inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Khóa">
                                            <i class="fas fa-lock"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="fas fa-users-slash fa-3x mb-3 d-block opacity-50"></i>
                                <p class="mb-0">Chưa có người dùng nào</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
